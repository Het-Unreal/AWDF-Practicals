# ==============================================================================
# Docker Compose Orchestration File - Practical 11
# Multi-container full-stack application (Frontend + Backend + MongoDB)
# ==============================================================================
version: '3.8'

services:
  # 1. MongoDB Database Service
  mongodb:
    image: mongo:latest
    container_name: task-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      # Supplementary Problem 3: Named volume for data persistence across container restarts
      - mongo-data:/data/db
    networks:
      - app-network

  # 2. Node.js & Express REST Backend Service
  backend:
    build:
      context: ./task-manager-api
      dockerfile: Dockerfile
    container_name: task-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/taskmanager
      - JWT_SECRET=supersecretjwtkey123
      - NODE_ENV=production
    depends_on:
      - mongodb
    networks:
      - app-network

  # 3. React Frontend Service (Multi-Stage Build)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: task-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - app-network

# Supplementary Problem 3: Named Volume Definition
volumes:
  mongo-data:
    driver: local

# Internal Bridge Network for Inter-Container Communication
networks:
  app-network:
    driver: bridge
